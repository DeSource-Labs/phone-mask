name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**/package.json'
      - 'packages/**/CHANGELOG.md'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only publish when explicitly signaled by commit message or manual dispatch
    if: "${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore: Release packages') || contains(github.event.head_commit.message, 'chore: release packages') }}"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare GitHub release
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node scripts/prepare-github-release.mts

      - name: Build and publish packages to npm
        run: pnpm changeset:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists"
          else
            release_options=(
              --target "$GITHUB_SHA"
              --title "$VERSION"
              --notes-file "$RELEASE_NOTES_PATH"
            )

            if [[ "$PRERELEASE" == 'true' ]]; then
              release_options+=(--prerelease)
            fi

            gh release create "$VERSION" "${release_options[@]}"
          fi
