name: Benchmarks update

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmarks-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update comparison benchmark section & bundle size badges
        run: |
          pnpm docs:benchmarks

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            .github/badges
            docs/comparison.md
            demo/shared/generated/bundle-sizes.ts
          commit-message: 'docs: Refresh benchmarks & bundle size badges'
          title: 'docs: Refresh benchmarks & bundle size badges'
          body: |
            Automated benchmarks & bundle size refresh from packed workspace packages via GitHub Actions.

            This PR was created automatically after running `pnpm docs:benchmarks`.

            cc @stefashkaa
          branch: chore/comparison-benchmarks
          branch-suffix: timestamp
          labels: |
            automation
            docs
            benchmarks
          assignees: |
            stefashkaa
          reviewers: |
            stefashkaa
          signoff: false
          delete-branch: true
          draft: false

      - name: PR created output
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          echo "Created PR #${{ steps.cpr.outputs.pull-request-number }}"

      - name: No changes detected
        if: steps.cpr.outputs.pull-request-number == ''
        run: echo "No changes to commit; skipping PR."
