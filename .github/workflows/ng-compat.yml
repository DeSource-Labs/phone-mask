name: Angular Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-compatibility:
    name: Angular ${{ matrix.angular }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { angular: '19.0.0', typescript: '5.6.3' }
          - { angular: '20.0.0', typescript: '5.8.3' }
          - { angular: '21.0.0', typescript: '5.9.3' }
          - { angular: '22.0.0', typescript: '6.0.3' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@desource/phone-mask-angular...' build
      - run: pnpm --filter @desource/phone-mask-angular test:compat ${{ matrix.angular }} ${{ matrix.typescript }}
