packages:
  - packages/*
  - demo

overrides:
  glob: ^14.0.3
  # Less has no patched image-size release in its legacy range; this repo does not use its image helpers.
  'less>image-size': '-'

packageExtensions:
  # The plugin imports TypeScript but does not declare it; use the Angular workspace's compiler.
  '@analogjs/vite-plugin-angular@2.9.2':
    peerDependencies:
      typescript: '*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
